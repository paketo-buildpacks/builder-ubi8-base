description = "Ubi 8 base builder with buildpacks for Node.js, Java, Quarkus and Procfile"

[build]
  image = "docker.io/paketobuildpacks/build-ubi8-base:0.0.172"

[[buildpacks]]
  uri = "docker://docker.io/paketocommunity/ubi-java-buildpack:0.1.1"
  version = "0.1.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/quarkus:0.7.0"
  version = "0.7.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:20.4.0"
  version = "20.4.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:9.15.3"
  version = "9.15.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.12.0"
  version = "5.12.0"

[[extensions]]
  id = "paketo-community/ubi-java-extension"
  uri = "docker://docker.io/paketocommunity/ubi-java-extension:0.2.0"
  version = "0.2.0"

[[extensions]]
  id = "paketo-buildpacks/ubi-nodejs-extension"
  uri = "docker://docker.io/paketobuildpacks/ubi-nodejs-extension:1.5.14"
  version = "1.5.14"

[lifecycle]
  version = "0.20.19"

[[order]]

  [[order.group]]
    id = "paketo-community/ubi-java-buildpack"
    version = "0.1.1"

  [[order.group]]
    id = "paketo-buildpacks/quarkus"
    optional = true
    version = "0.7.0"

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "20.4.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "9.15.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.12.0"

[[order-extensions]]

  [[order-extensions.group]]
    id = "paketo-community/ubi-java-extension"
    version = "0.2.0"

  [[order-extensions.group]]
    id = "paketo-buildpacks/ubi-nodejs-extension"
    version = "1.5.14"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/run-ubi8-base:latest"

[stack]
  id = "io.buildpacks.stacks.ubi8"

[[targets]]
  arch = "amd64"
  os = "linux"
