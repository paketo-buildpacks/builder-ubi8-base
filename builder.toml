description = "Ubi 8 base builder with buildpacks for Node.js, Java, Quarkus and Procfile"

[[buildpacks]]
  uri = "docker://docker.io/paketocommunity/ubi-java-buildpack:0.1.1"
  version = "0.1.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/quarkus:0.6.3"
  version = "0.6.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:19.0.0"
  version = "19.0.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:9.8.1"
  version = "9.8.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.11.3"
  version = "5.11.3"

[[extensions]]
  id = "paketo-community/ubi-java-extension"
  uri = "docker://docker.io/paketocommunity/ubi-java-extension:0.2.0"
  version = "0.2.0"

[[extensions]]
  id = "paketo-buildpacks/ubi-nodejs-extension"
  uri = "docker://docker.io/paketobuildpacks/ubi-nodejs-extension:1.5.5"
  version = "1.5.5"

[lifecycle]
  version = "0.20.14"

[[order]]

  [[order.group]]
    id = "paketo-community/ubi-java-buildpack"
    version = "0.1.1"

  [[order.group]]
    id = "paketo-buildpacks/quarkus"
    optional = true
    version = "0.6.3"

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "19.0.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "9.8.1"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.11.3"

[[order-extensions]]

  [[order-extensions.group]]
    id = "paketo-community/ubi-java-extension"
    version = "0.2.0"

  [[order-extensions.group]]
    id = "paketo-buildpacks/ubi-nodejs-extension"
    version = "1.5.5"

[stack]
  build-image = "docker.io/paketobuildpacks/build-ubi8-base:0.0.157"
  id = "io.buildpacks.stacks.ubi8"
  run-image = "index.docker.io/paketobuildpacks/run-ubi8-base:latest"
